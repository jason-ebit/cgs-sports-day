<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Sports Day · Responsive QA</title><style>body{background:#eee;font:14px system-ui;margin:24px}header{display:flex;gap:16px;align-items:center;margin-bottom:16px}iframe{flex-shrink:0;display:block;width:390px;height:844px;border:1px solid #aaa;background:white;border-radius:14px}select,button{padding:8px;font:inherit}.frames{display:flex;gap:24px;align-items:start}.description{width:250px;line-height:1.8}h1{font-size:20px}#status{font-size:12px}</style><header><h1>Responsive preview</h1><label>Viewport <select id="size"><option value="390">390 px · phone</option><option value="320">320 px · narrow phone</option><option value="760">760 px · small tablet</option><option value="1024">1024 px · tablet</option><option value="1440">1440 px · desktop</option></select></label><a href="../">Open app</a></header><div class="frames"><iframe title="Sports Day app at selected viewport" src="../"></iframe><div class="description"><p>Live app at the selected CSS viewport. Test scrolling, event panels, keyboard navigation, team choices and exports.</p><p>Shares this browser’s event data. Leave test results cleared when finished.</p><p id="status"></p></div></div><script>const frame=document.querySelector('iframe');function check(){const d=frame.contentDocument;document.querySelector('#status').textContent=`Viewport: ${frame.clientWidth}px. Document: ${d.documentElement.scrollWidth}px. ${d.documentElement.scrollWidth<=frame.clientWidth?'No page overflow.':'Page overflow detected.'} Height: ${d.documentElement.scrollHeight}px / ${frame.clientHeight}px.`;}document.querySelector('#size').onchange=e=>{frame.style.width=e.target.value+'px';frame.style.height=(e.target.value==='320'?667:e.target.value==='1024'?768:844)+'px';setTimeout(check,200);};frame.onload=()=>setTimeout(check,600);</script></html>
